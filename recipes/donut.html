    <h1>Donut</h1>
    <img src="../images/donut.png" alt="Donut">
    <p>Donut is a wonderful food added by <a href="https://www.curseforge.com/minecraft/mc-mods/younashis-donutcraft">this mod</a>.</p>
    <p>Ingredients:</p>
    <ul>
        <li>Egg</li>
        <li>Wheat × 6</li>
        <li>Sugar</li>
        <li>Some fuel</li>
    </ul>
    <p>How to make it:</p>
    <ol>
        <li>
            <p>Place the ingredients on crafting table.</p>
            <img src="../images/craft_donut.png">
        </li>
        <li>Put it into a furnace.</li>
        <li>
            <p>Put fuels as well.</p>
            <img src="../images/cook_donut.png">
        </li>
        <li>Done!</li>
    </ol>
